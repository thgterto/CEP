<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEP PRO - Controle Estatístico Avançado</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- External Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" integrity="sha384-Hl48Kq2HifOWdXEjMsKo6qxqvRLTYqIGbvlENBmkHAxZKIGCXv43H6W1jA671RzC" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js" integrity="sha384-7uGOMhLhjroTamet5l69PR8EGxKUyWZlZOFFDRymtVqIfsh4Hj7uZRctW67ZCdkD" crossorigin="anonymous"></script>

    <!-- Tooltips (Popper + Tippy) -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
</head>
<body>
    <!-- Skip Link -->
    <a href="#main-content" class="skip-link">Pular para conteúdo principal</a>

    <!-- Header -->
    <header class="app-header">
        <div class="brand">
            <span class="material-icons">analytics</span>
            <h1>CEP PRO <small>v2.0</small></h1>
        </div>
        <div class="kpi-container" id="header-kpis">
            <!-- KPIs injected by JS -->
            <div class="kpi-item" role="status" aria-live="polite" data-tippy-content="Número total de amostras processadas">
                <span class="label" id="lbl-n">N (Amostras)</span>
                <span class="value" id="kpi-n" aria-labelledby="lbl-n">-</span>
            </div>
            <div class="kpi-item" role="status" aria-live="polite" data-tippy-content="<strong>Cpk (Capacidade Real)</strong><br>Indica se o processo é capaz.<br>> 1.33: Capaz" data-tippy-allowHTML="true">
                <span class="label" id="lbl-cpk">Cpk</span>
                <span class="value" id="kpi-cpk" aria-labelledby="lbl-cpk">-</span>
            </div>
            <div class="kpi-item" role="status" aria-live="polite" data-tippy-content="Total de pontos fora de controle (regras de Nelson)">
                <span class="label" id="lbl-viol">Violações</span>
                <span class="value violation-badge" id="kpi-violations" aria-labelledby="lbl-viol">0</span>
            </div>
        </div>
        <div class="header-controls">
            <button class="icon-btn" onclick="toggleSidebar()" title="Alternar Sidebar" aria-label="Alternar barra lateral">
                <span class="material-icons">menu_open</span>
            </button>
            <button class="icon-btn" onclick="togglePanel()" title="Alternar Painel" aria-label="Alternar painel lateral">
                <span class="material-icons">space_dashboard</span>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="app-container">

        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar" aria-label="Configurações e Dados">
            <div class="sidebar-section">
                <h3><span class="material-icons">input</span> Dados</h3>
                <div class="input-group">
                    <label>Importar Dados</label>
                    <div class="button-group-vertical">
                        <button class="btn secondary" onclick="document.getElementById('file-upload').click()">
                            <span class="material-icons">upload_file</span> Excel (.xlsx)
                        </button>
                        <input type="file" id="file-upload" accept=".xlsx" hidden aria-label="Upload arquivo Excel">

                        <button class="btn secondary" onclick="App.loadDemo()">
                            <span class="material-icons">auto_fix_high</span> Dados Demo
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="paste-area">Colar Dados (csv/txt)</label>
                    <textarea id="paste-area" placeholder="Cole valores aqui..." rows="3"></textarea>
                    <button class="btn secondary small" onclick="App.loadPaste()">Carregar</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3><span class="material-icons">settings</span> Configuração</h3>
                <div class="input-group">
                    <label for="chart-type">Tipo de Carta <span class="help-icon" data-tippy-content="Selecione o tipo de gráfico de controle adequado para seus dados.">?</span></label>
                    <select id="chart-type">
                        <option value="imr">I-MR (Individual)</option>
                        <option value="xbarr">X̄-R (Subgrupos)</option>
                        <option value="xbars">X̄-S (Subgrupos > 10)</option>
                        <option value="cusum">CUSUM</option>
                        <option value="ewma">EWMA</option>
                        <option value="run">Run Chart</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="subgroup-size">Tamanho Subgrupo (n) <span class="help-icon" data-tippy-content="Tamanho da amostra para cada ponto. Use 2-10 para X-R, >10 para X-S.">?</span></label>
                    <input type="number" id="subgroup-size" value="5" min="2" max="25">
                </div>

                <div class="input-group">
                    <label>Limites Especificação <span class="help-icon" data-tippy-content="Limites definidos pelo cliente/engenharia para calcular capacidade (Cp/Cpk).">?</span></label>
                    <div class="row">
                        <div class="col">
                            <small id="lbl-lsl">LSL</small>
                            <input type="number" id="lsl" placeholder="Min" aria-labelledby="lbl-lsl">
                        </div>
                        <div class="col">
                            <small id="lbl-usl">USL</small>
                            <input type="number" id="usl" placeholder="Max" aria-labelledby="lbl-usl">
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button class="btn primary full-width" onclick="App.calculate()">
                    <span class="material-icons">play_arrow</span> Calcular CEP
                </button>
            </div>
        </aside>

        <!-- Center Area -->
        <main class="main-content" id="main-content" tabindex="-1">
            <div id="charts-container" class="charts-grid" role="region" aria-label="Gráficos de Controle">
                <!-- Charts injected by JS -->
                <div class="placeholder-message">
                    <span class="material-icons">bar_chart</span>
                    <p>Carregue dados para visualizar as cartas de controle</p>
                </div>
            </div>
        </main>

        <!-- Right Panel -->
        <aside class="panel" id="right-panel" aria-label="Estatísticas e Análise">
            <div class="panel-section">
                <h3><span class="material-icons">analytics</span> Estatísticas</h3>
                <div id="stats-content" class="stats-grid">
                    <!-- Stats injected by JS -->
                </div>
            </div>

            <div class="panel-section">
                <h3><span class="material-icons">speed</span> Capacidade</h3>
                <div id="capability-content" class="capability-cards">
                    <!-- Cp/Cpk injected by JS -->
                </div>
            </div>

            <div class="panel-section flex-grow">
                <h3>
                    <span class="material-icons">error_outline</span> Log de Violações
                    <span class="badge" id="violation-count">0</span>
                </h3>
                <div id="violation-log" class="violation-log-container" role="log" aria-live="polite">
                    <!-- Logs injected by JS -->
                </div>
            </div>

            <div class="panel-section">
                <h3>Ações</h3>
                <div class="button-grid">
                    <button class="btn action" onclick="App.drawPareto()">Pareto</button>
                    <button class="btn action" onclick="App.drawBoxplot()">Boxplot</button>
                    <button class="btn action" onclick="App.drawInsights()">Insights</button>
                    <button class="btn secondary" onclick="App.exportCSV('violations')">Exp. CSV</button>
                    <button class="btn secondary" onclick="App.exportXLSX()">Exp. XLSX</button>
                </div>
            </div>
        </aside>

    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Título Modal</h3>
                <button class="icon-btn" onclick="App.closeModal()" aria-label="Fechar modal">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Content -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <button class="btn secondary" onclick="App.closeModal()">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/spc.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
